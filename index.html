<body>
<main id="app">
<header><div><small>PROJECT / CLOCK OUT</small><h1>一分钟逃离办公室</h1></div><div><button class="icon" id="sound" aria-label="开启声音">♪</button> <button class="icon" id="pause" aria-label="暂停游戏">Ⅱ</button></div></header>
<div class="off-clock" id="offClock"><div><span id="offClockLabel">距离今天 18:00 下班</span><div class="clock-note">真实时间 · 中国时间</div></div><strong id="offClockValue">--:--:--</strong></div>
<div class="stats"><div class="timer-wrap"><div><span class="time-label">本层剩余</span><span class="time" id="time">60.0</span></div></div><span class="chip" id="floor">1F / 3F</span><span id="lives" aria-label="剩余容错次数">♥ ♥ ♥</span><span style="margin-left:auto;font-size:10px" id="inventory">☕ × 1</span><button class="collection-button" id="collection" aria-label="打开小物图鉴">◇ 0/6</button></div>
<div class="objective" id="objective">拿到门禁卡，然后前往 EXIT</div>
<div class="bar" aria-label="警觉程度"><i id="alert"></i></div>
<div id="viewport"><canvas id="game" width="360" height="540" aria-label="办公室潜行游戏场景"></canvas><div id="toast" role="status" aria-live="polite"></div></div>
<div id="controls"><div id="stick" role="group" aria-label="拖动摇杆移动"><div id="knob"></div></div><div class="actions"><button class="action secondary" id="coffee"><span>☕</span>诱饵</button><button class="action" id="interact"><span>◎</span><b id="actionText">互动</b></button></div></div>
<div class="hint">轻推慢走 · 工位可伪装 · 标有「藏」的柜子和绿植可藏身</div>
<div id="overlay"></div>
</main><div id="rotate">↻<br>请把手机转回竖屏<br>下班路线，竖着更顺手</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=360,H=540,TAU=Math.PI*2;
canvas.width=720;canvas.height=1080;ctx.scale(2,2);
const levels=[
 {name:'开放办公区',subtitle:'先学会躲，再学会溜',start:[46,488],exit:[298,30],card:[52,91],stamp:null,coffee:[300,320],bosses:[{path:[[188,95],[188,270],[306,270],[306,92]],speed:46}],furniture:[['desk',28,142,98,42],['desk',236,142,98,42],['desk',28,276,98,42],['desk',236,374,98,42],['cabinet',148,360,40,102],['plant',139,199,27,29],['sofa',31,374,76,35]]},
 {name:'财务审批区',subtitle:'签完字才准下班？',start:[44,488],exit:[296,30],card:[303,319],stamp:[57,86],coffee:[182,322],bosses:[{path:[[179,100],[179,252],[52,252],[52,104]],speed:47},{path:[[300,241],[300,460],[224,460],[224,241]],speed:44}],furniture:[['desk',24,144,104,43],['desk',234,143,103,43],['cabinet',144,176,40,64],['desk',25,330,99,43],['desk',233,353,102,43],['plant',140,416,27,30],['sofa',215,79,70,31]]},
 {name:'总经理办公室',subtitle:'最后一层，全身而退',start:[43,488],exit:[294,30],card:[305,447],stamp:[48,85],coffee:[182,297],bosses:[{path:[[185,106],[185,280],[303,280],[303,100]],speed:53},{path:[[59,251],[59,432],[183,432],[183,252]],speed:48}],furniture:[['desk',22,144,106,43],['desk',234,144,104,43],['cabinet',143,176,39,62],['desk',235,341,101,43],['sofa',26,334,98,35],['desk',128,465,88,38],['plant',140,74,27,30],['plant',202,339,25,29]]}
];
let hidden=null,runLoot=new Set(),collected=readCollection(),offTarget=null,offTime=validTime(storageGet('officeEscapeOffTime'))||'18:00',offDay='today',offLastSecond=-1,storageAvailable=true;
const lootCatalog=[
 {id:'cookie',icon:'🍪',name:'最后一块饼干',desc:'茶水间的快乐，只剩这一口。',floor:0,x:310,y:222},
 {id:'note',icon:'📝',name:'摸鱼便利贴',desc:'“忙碌中，请勿打扰。”',floor:0,x:54,y:445},
 {id:'plant',icon:'🪴',name:'迷你多肉',desc:'它也在努力不加班。',floor:1,x:310,y:108},

];
let state='intro',level=0,player,bosses,items,timer=60,lives=3,alert=0,disguised=false,card=false,stamp=false,coffee=1,invincible=0,decoy=null,noise=0,particles=[],trail=[],elapsed=0,totalTime=0,catches=0,sound=false,audio=null,last=0,toastTime=0,levelStats=[],stickId=null;
const input={x:0,y:0},keys={};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function storageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function storageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function readCollection(){try{const a=JSON.parse(storageGet('officeEscapeCollection')||'[]');return new Set(Array.isArray(a)?a.filter(id=>['cookie','note','plant','eraser','badge','duck'].includes(id)):[])}catch(e){return new Set()}}
function validTime(t){return typeof t==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t)?t:null}
function shanghaiDate(now=Date.now()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(now)}
function scheduleTarget(time,day,now=Date.now()){if(!validTime(time))return null;const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=k=>parts.find(p=>p.type===k).value;return Date.parse(get('year')+'-'+get('month')+'-'+get('day')+'T'+time+':00+08:00')+(day==='tomorrow'?86400000:0)}
function formatOff(ms){if(ms<=0)return '到点了，准时下班！';const sec=Math.ceil(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function updateOffClock(now=Date.now(),force=false){const sec=Math.floor(now/1000);if(!force&&sec===offLastSecond)return;offLastSecond=sec;const remaining=offTarget===null?null:offTarget-now;$('offClockLabel').textContent=offTarget===null?'开始前设置你的下班时间':(offDay==='today'?'今天':'明天')+' '+offTime+' · 距离下班';$('offClockValue').textContent=remaining===null?'--:--:--':formatOff(remaining);$('offClock').classList.toggle('done',remaining!==null&&remaining<=0)}
function scheduleHTML(){return '<div class="settings-box"><label for="offTimeInput">你几点下班？ <span class="clock-note">中国时间</span></label><div class="schedule-row"><select id="offDayInput" aria-label="下班日期"><option value="today">今天</option><option value="tomorrow">明天</option></select><input type="time" id="offTimeInput" required aria-label="下班时间"></div><div class="preset-row"><button type="button" data-time="17:30">17:30</button><button type="button" data-time="18:00">18:00</button><button type="button" data-time="18:30">18:30</button><button type="button" data-time="19:00">19:00</button></div><div id="schedulePreview" class="schedule-preview" role="status"></div></div>'}
function bindSchedule(){const time=$('offTimeInput'),day=$('offDayInput');time.value=offTime;day.value=offDay;const preview=()=>{const v=validTime(time.value);$('schedulePreview').textContent=v?((scheduleTarget(v,day.value)<=Date.now())?'今天已经到下班时间啦！也可以选择明天。':'距离下班 '+formatOff(scheduleTarget(v,day.value)-Date.now())+' · 不影响每层 60 秒挑战'):'请选择有效的下班时间';};time.oninput=preview;day.onchange=preview;document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time.value=b.dataset.time;preview()});preview()}
function saveSchedule(){const time=validTime($('offTimeInput').value);if(!time){$('schedulePreview').textContent='请先填写有效的下班时间';$('offTimeInput').focus();return false}offTime=time;offDay=$('offDayInput').value;offTarget=scheduleTarget(offTime,offDay);storageSet('officeEscapeOffTime',offTime);updateOffClock(Date.now(),true);return true}
function collectionSummary(){return '图鉴 '+collected.size+'/'+lootCatalog.length+' · 本次拾取 '+runLoot.size+' 件'}
function showCollection(back){show('<div class="eyebrow">OFFICE TREASURES</div><h2>下班小物图鉴</h2><p>每层藏着两件小物，靠近后点「收集」。<br>不影响开门，拿到即记入图鉴。</p><div class="loot-grid">'+lootCatalog.map(i=>'<div class="loot-card '+(collected.has(i.id)?'':'locked')+'"><span class="loot-icon">'+(collected.has(i.id)?i.icon:'?')+'</span><b>'+i.name+'</b><p>'+(collected.has(i.id)?i.desc:'未收集 · 在 '+(i.floor+1)+'F 找找看')+'</p></div>').join('')+'</div><div class="collection-status">'+collectionSummary()+(storageAvailable?' · 当前浏览器自动保存':' · 当前浏览器不支持保存，请勿关闭页面')+'</div><button class="primary" id="backCollection">返回</button>');$('backCollection').onclick=back}
function showSettings(){show('<div class="eyebrow">YOUR CLOCK OUT</div><h2>设定下班时间</h2>'+scheduleHTML()+'<p>真实下班倒计时在游戏暂停时也会继续。<br>每层的 60 秒挑战只随游戏运行。</p><button class="primary" id="saveSettings">保存设置</button><button class="ghost" id="cancelSettings">返回暂停菜单</button>');bindSchedule();$('saveSettings').onclick=()=>{if(saveSchedule())pauseMenu()};$('cancelSettings').onclick=pauseMenu}
function pauseMenu(){state='paused';show('<div class="eyebrow">TAKE A BREATH</div><h2>暂时摸鱼。</h2><p>本层游戏倒计时已暂停。<br>真实下班倒计时继续走。</p><button class="primary" id="resume">继续行动</button><div class="menu-row"><button class="ghost" id="pauseCollection">小物图鉴</button><button class="ghost" id="settings">下班时间</button></div><button class="ghost" id="reset">重新开始这一层</button><button class="ghost" id="home">回开始界面</button>');$('resume').onclick=()=>{state='playing';hide()};$('pauseCollection').onclick=()=>showCollection(pauseMenu);$('settings').onclick=showSettings;$('reset').onclick=()=>{coffee=Math.max(1,coffee);loadLevel()};$('home').onclick=intro}
function nearestHide(){let found=null,best=27;for(const f of levels[level].furniture){if(!['cabinet','plant'].includes(f[0]))continue;const q={x:clamp(player.x,f[1],f[1]+f[3]),y:clamp(player.y,f[2],f[2]+f[4])},d=dist(player,q);if(d<best){best=d;found=f}}return found}
function leaveHide(){if(!hidden)return;player.x=hidden.entry.x;player.y=hidden.entry.y;hidden=null;toast('离开藏身处，小心老板的视线')}
function enterHide(f){if(alert>35||bosses.some(b=>b.mode==='chase')){toast('老板还在怀疑你！先甩开追逐，再藏起来');return}disguised=false;hidden={f,entry:{x:player.x,y:player.y}};resetInput();toast((f[0]==='cabinet'?'藏进柜子':'躲入茂密绿植')+' · 点「出来」或推摇杆离开');beep(320,.1);updateHUD()}
function collectLoot(i){const isNew=!collected.has(i.id);collected.add(i.id);runLoot.add(i.id);storageAvailable=storageSet('officeEscapeCollection',JSON.stringify([...collected]));toast((isNew?'图鉴新发现：':'再次找到：')+i.icon+' '+i.name+' · 通关加 120 分'+(!storageAvailable?'（本次会话保存）':''));vibrate(30);beep(960,.16)}

function beep(f=440,d=.08,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function vibrate(ms){try{navigator.vibrate?.(ms)}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;toastTime=2.7}
function show(html){$('overlay').innerHTML='<div class="card">'+html+'</div>';$('overlay').style.display='flex';resetInput()}
function hide(){$('overlay').style.display='none'}

function resetInput(){input.x=0;input.y=0;stickId=null;for(const k in keys)delete keys[k];$('knob').style.transform='translate(0px,0px)'}
function stickMove(e){const r=$('stick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,limit=r.width*.32,m=Math.hypot(dx,dy),s=m>limit?limit/m:1;input.x=dx*s/limit;input.y=dy*s/limit;$('knob').style.transform='translate('+(dx*s/(r.width/102))+'px,'+(dy*s/(r.width/102))+'px)'}
$('stick').addEventListener('pointerdown',e=>{if(state!=='playing')return;if(stickId!==null)return;stickId=e.pointerId;$('stick').setPointerCapture(e.pointerId);stickMove(e);e.preventDefault()});$('stick').addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])$('stick').addEventListener(event,e=>{if(e.pointerId===stickId)resetInput()});
$('collection').onclick=()=>{if(state==='playing'){state='paused';showCollection(()=>{state='playing';hide()})}else if(state==='intro')showCollection(intro);else if(state==='paused')showCollection(pauseMenu)};
$('interact').onclick=interact;$('coffee').onclick=dropCoffee;$('pause').onclick=pause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪';$('sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');beep(660)};
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;keys[e.key]=true;if(e.key===' '||e.key==='e')interact();if(e.key==='q')dropCoffee();if(e.key==='Escape')pause()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{resetInput();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});window.addEventListener('resize',()=>{resetInput();if(innerWidth>innerHeight&&innerHeight<520&&state==='playing')pause();resize()});
function resize(){const r=$('viewport').getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);canvas.style.width=W*s+'px';canvas.style.height=H*s+'px'}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;updateOffClock();update(dt);draw();requestAnimationFrame(frame)}
